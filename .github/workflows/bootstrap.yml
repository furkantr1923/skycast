name: bootstrap
on:
  workflow_dispatch:
  push:
    branches: [bootstrap]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Platform klasörleri + API yoklaması
        run: |
          mkdir out && cd out
          flutter --version > flutter_version.txt 2>&1
          flutter create --project-name skycast --org com.furkan.skycast --platforms android,windows app >/dev/null
          rm -rf app/lib app/test app/.dart_tool app/build
          UA="SKYCAST/1.0 (+https://github.com/furkantr1923/skycast)"
          p(){ echo "=== $1" >> probe.txt; curl -sS -m 40 -A "$UA" -w "\nHTTP %{http_code}\n" "$2" 2>&1 | head -c ${3:-3000} >> probe.txt; echo >> probe.txt; }
          p rainviewer "https://api.rainviewer.com/public/weather-maps.json" 4000
          p mal-turkey "https://feeds.meteoalarm.org/api/v1/warnings/feeds-turkey" 2500
          p mal-germany "https://feeds.meteoalarm.org/api/v1/warnings/feeds-germany" 2500
          p om-forecast "https://api.open-meteo.com/v1/forecast?latitude=41.01&longitude=28.97&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max&forecast_days=16&timezone=auto" 2500
          p om-multi "https://api.open-meteo.com/v1/forecast?latitude=41,40&longitude=29,33&current=temperature_2m,wind_speed_10m" 1500
          p om-aq "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=41.01&longitude=28.97&current=european_aqi,us_aqi&timezone=auto" 1500
          p om-geo "https://geocoding-api.open-meteo.com/v1/search?name=%C3%87orum&count=3&language=tr" 2000
          p nominatim "https://nominatim.openstreetmap.org/reverse?lat=41.01&lon=28.97&format=jsonv2&accept-language=tr&zoom=10" 1500
          p carto "https://a.basemaps.cartocdn.com/dark_all/5/18/11.png" 200
          curl -sS -m 60 -A "$UA" "https://view.eumetsat.int/geoserver/wms?service=WMS&request=GetCapabilities&version=1.3.0" -o eum.xml || true
          echo "=== eumetsat layers" >> probe.txt
          grep -oE "<Name>[^<]+</Name>" eum.xml | sort -u | grep -iE "ir|rgb|cloud|natural|dust|fes|mtg" | head -120 >> probe.txt || true
          python3 - >> probe.txt <<'PY' || true
          import re
          x=open('eum.xml',encoding='utf-8',errors='ignore').read()
          for name in ['msg_fes:ir108','mtg_fd:ir105_hrfi','msg_fes:rgb_naturalenhncd','mtg_fd:rgb_geocolour','msg_fes:rgb_eview']:
              i=x.find('<Name>'+name+'</Name>')
              if i<0: print(name,'YOK'); continue
              seg=x[i:i+4000]
              m=re.search(r'<Dimension name="time"[^>]*>([^<]{0,300})',seg)
              print(name,'VAR', m.group(0)[:300] if m else 'time yok')
          PY
          curl -sS -m 60 "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/1.0.0/WMTSCapabilities.xml" -o gibs.xml || true
          echo "=== gibs" >> probe.txt
          grep -oE "<ows:Identifier>[^<]+</ows:Identifier>" gibs.xml | sort -u | grep -iE "Infrared|TrueColor|Geocolor|Meteosat|Himawari|GOES|Air_Mass|Cloud" | head -60 >> probe.txt || true
          rm -f eum.xml gibs.xml
      - name: Sonuçları bootstrap-out dalına koy
        run: |
          cd out
          git init -q -b bootstrap-out && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" bootstrap-out
permissions:
  contents: write
