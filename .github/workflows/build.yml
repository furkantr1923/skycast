name: SKYCAST CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.50.1'
  APP_VERSION: '1.0.0'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analiz + birim/arayüz testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Statik analiz
        run: flutter analyze --no-fatal-infos | tee analyze.txt
      - name: Testler
        run: flutter test --reporter expanded | tee test.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-raporu
          path: |
            analyze.txt
            test.txt
            pubspec.lock

  windows:
    name: Windows (Setup.exe + taşınabilir)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Derle
        run: flutter build windows --release
      - name: VC++ çalışma zamanı DLL'lerini uygulamanın yanına koy
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          foreach ($d in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$d" $rel -ErrorAction SilentlyContinue
          }
          Get-ChildItem $rel | Format-Table Name, Length
      - name: Gerçek uygulamayı çalıştır (öz-sınama + ekran görüntüleri)
        shell: pwsh
        run: |
          $cap = "$pwd\capture\windows"
          New-Item -ItemType Directory -Force $cap | Out-Null
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath "build\windows\x64\runner\Release\SKYCAST.exe" -ArgumentList "--capture=$cap" -PassThru
          $peak = 0
          while (-not $p.HasExited -and $sw.Elapsed.TotalSeconds -lt 360) {
            Start-Sleep -Seconds 2
            try { $p.Refresh(); if ($p.WorkingSet64 -gt $peak) { $peak = $p.WorkingSet64 } } catch {}
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force; "UYARI: zaman aşımı" | Out-File -Append "$cap\selftest.txt" }
          "Windows çalışma süresi: $([int]$sw.Elapsed.TotalSeconds) sn · en yüksek bellek (WorkingSet): $([int]($peak/1MB)) MB · çıkış kodu: $($p.ExitCode)" | Out-File -Append "$cap\selftest.txt"
          Get-Content "$cap\selftest.txt"
          Get-ChildItem $cap
      - name: Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:APP_VERSION /DSourceDir="$pwd\build\windows\x64\runner\Release" installer\skycast.iss
      - name: Taşınabilir zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $dst = "dist\SKYCAST-Windows-$env:APP_VERSION"
          Copy-Item -Recurse "build\windows\x64\runner\Release" $dst
          Compress-Archive -Path $dst -DestinationPath "dist\SKYCAST-Windows-$env:APP_VERSION-portable.zip"
          Remove-Item -Recurse $dst
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
            capture/windows

  android:
    name: Android (imzalı APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: İmza anahtarı
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.jks
            PASS="$KS_PASS"; echo "Kalıcı anahtar (GitHub Secrets) kullanılıyor"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore android/app/release.jks -alias skycast -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Furkan, O=SKYCAST, C=TR" >/dev/null
            echo "UYARI: Secrets tanımlı değil, bu derleme için geçici anahtar üretildi (bkz. docs/KURULUM.md)"
          fi
          printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=skycast\nkeyPassword=%s\n" "$PASS" "$PASS" > android/key.properties
      - name: Sürüm APK
        run: flutter build apk --release
      - name: Öz-sınama APK (yalnızca CI ekran görüntüleri için)
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SKYCAST-$APP_VERSION.apk
          flutter build apk --release --dart-define=SKYCAST_CAPTURE=true
          cp build/app/outputs/flutter-apk/app-release.apk capture-selftest.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs dist/SKYCAST-$APP_VERSION.apk | head -4
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist/*.apk
            capture-selftest.apk

  emulator:
    name: Android emülatör (kurulum, açılış, gerçek veri)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tool/ci/android_e2e.sh apk/dist/SKYCAST-${{ env.APP_VERSION }}.apk apk/capture-selftest.apk capture/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e
          path: capture/android

  publish:
    name: Derlenmiş dosyaları yayınla
    needs: [test, windows, android, emulator]
    if: always() && needs.windows.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: actions/download-artifact@v4
        with: { name: windows, path: out/windows }
      - uses: actions/download-artifact@v4
        with: { name: android, path: out/android }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: android-e2e, path: out/android-e2e }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: test-raporu, path: out/test }
      - name: builds dalına gönder
        run: |
          cd out
          rm -f android/capture-selftest.apk
          echo "Derleme: ${GITHUB_SHA} · $(date -u +%FT%TZ) · test=${{ needs.test.result }} emulator=${{ needs.emulator.result }}" > BUILD.txt
          git init -q -b builds && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Derleme ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
      - name: GitHub Release (etiketlerde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SKYCAST ${{ github.ref_name }}
          body_path: src/CHANGELOG.md
          files: |
            out/windows/dist/*.exe
            out/windows/dist/*.zip
            out/android/dist/*.apk
